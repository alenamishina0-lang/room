<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сюрприз</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #ffe9a8 0%, #ffb6d9 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow: hidden;
  }

  h1 {
    color: #ff4fa3;
    font-size: 48px;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 #ffd166;
    margin-bottom: 20px;
  }

  .hint {
    background: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 20px;
    color: #555;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 30px;
  }

  .room {
    position: relative;
    width: 90vw;
    max-width: 800px;
    height: 60vh;
    background: linear-gradient(180deg, #c9f0ff 0%, #a8e6cf 100%);
    border: 6px solid #fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    justify-content: space-around;
    align-items: center;
    perspective: 1000px;
  }

  /* КЛЮЧ */
  .key {
    font-size: 90px;
    cursor: pointer;
    opacity: 0.45;
    filter: grayscale(70%);
    animation: float 3s ease-in-out infinite;
    transition: all 0.5s ease;
    user-select: none;
  }

  .key:hover {
    transform: scale(1.1);
  }

  .key.found {
    opacity: 1;
    filter: grayscale(0%) drop-shadow(0 0 15px gold) drop-shadow(0 0 25px gold);
    animation: glow 1.5s ease-in-out infinite alternate;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50%      { transform: translateY(-15px) rotate(10deg); }
  }

  @keyframes glow {
    from { filter: grayscale(0%) drop-shadow(0 0 10px gold); }
    to   { filter: grayscale(0%) drop-shadow(0 0 30px gold); }
  }

  /* ДВЕРЬ */
  .door-wrap {
    width: 180px;
    height: 280px;
    perspective: 800px;
  }

  .door {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #8b5a2b 0%, #6b3e1a 100%);
    border: 4px solid #4a2a10;
    border-radius: 10px 10px 0 0;
    position: relative;
    cursor: pointer;
    transform-origin: left center;
    transition: transform 1s ease;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
  }

  .door::before {
    content: "";
    position: absolute;
    top: 50%;
    right: 20px;
    width: 15px;
    height: 15px;
    background: gold;
    border-radius: 50%;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
  }

  .door::after {
    content: "";
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    bottom: 40%;
    border: 3px solid #4a2a10;
    border-radius: 5px;
  }

  .door.open {
    transform: rotateY(-85deg);
  }

  .door:hover:not(.open) {
    filter: brightness(1.1);
  }

  /* СООБЩЕНИЕ */
  .message {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #fff;
    padding: 25px 40px;
    border-radius: 20px;
    font-size: 26px;
    color: #ff4fa3;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: 4px dashed #ffd166;
    z-index: 10;
    opacity: 0;
    transition: all 0.4s ease;
  }

  .message.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* ПОБЕДА */
  .win {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #fff;
    padding: 40px 60px;
    border-radius: 30px;
    font-size: 36px;
    color: #ff4fa3;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    border: 6px solid #ffd166;
    z-index: 20;
    opacity: 0;
    transition: all 0.5s ease;
    text-align: center;
  }

  .win.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
</style>
</head>
<body>

  <h1>✨ Сюрприз ✨</h1>
  <div class="hint">Найди ключик и открой дверь!</div>

  <div class="room">
    <div class="key" id="key">🔑</div>
    <div class="door-wrap">
      <div class="door" id="door"></div>
    </div>
  </div>

  <div class="message" id="message">Сначала найди ключик :)</div>
  <div class="win" id="win">🎉 Ура! Сюрприз внутри! 🎉</div>

<script>
  const key     = document.getElementById('key');
  const door    = document.getElementById('door');
  const message = document.getElementById('message');
  const win     = document.getElementById('win');

  let keyFound = false;
  let doorOpened = false;

  // Правило 1: нажали на ключ → ключ найден
  key.addEventListener('click', () => {
    if (!keyFound) {
      keyFound = true;
      key.classList.add('found');
    }
  });

  // Правило 2: нажали на дверь
  door.addEventListener('click', () => {
    if (doorOpened) return;

    if (!keyFound) {
      // Нарушение порядка — показываем подсказку
      message.classList.add('show');
      setTimeout(() => message.classList.remove('show'), 2000);
    } else {
      // Всё по порядку — дверь открывается
      doorOpened = true;
      door.classList.add('open');
      setTimeout(() => win.classList.add('show'), 900);
    }
  });
</script>

</body>
</html>
